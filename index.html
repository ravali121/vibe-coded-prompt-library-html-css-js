<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt Library</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Prompt Library</h1>
        <form id="prompt-form">
            <div class="form-group">
                <label for="prompt-title">Title</label>
                <input type="text" id="prompt-title" name="prompt-title" required maxlength="100">
            </div>
            <div class="form-group">
                <label for="prompt-content">Content</label>
                <textarea id="prompt-content" name="prompt-content" rows="4" required maxlength="1000"></textarea>
            </div>
            <div class="form-group">
                <label for="prompt-model">Model Name</label>
                <input type="text" id="prompt-model" name="prompt-model" required maxlength="100" placeholder="e.g. GPT-4, Claude-2">
            </div>
            <button type="submit" id="save-prompt">Save Prompt</button>
        </form>
        <hr>
        <div class="export-import-controls" style="margin-bottom:20px;text-align:center;">
            <button id="export-prompts" type="button">Export Prompts</button>
            <input id="import-file" type="file" accept="application/json" style="display:none;">
            <button id="import-prompts" type="button">Import Prompts</button>
            <span id="import-status" style="margin-left:10px;color:#b00;"></span>
        </div>
        <div id="prompts-list" class="prompts-list"></div>
    </div>
    <script src="app.js"></script>
</body>
</html>
